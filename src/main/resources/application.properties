spring.application.name=franchise-intel-backend
server.port=8080

# Server Configuration
server.servlet.context-path=/api
server.compression.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.franchiseintel=DEBUG

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AWS S3 Configuration
aws.s3.bucket-name=franchisedata
aws.s3.region=ap-south-1
aws.s3.access-key=AKIAZCSTRCJPLAQ5I3N4
aws.s3.secret-key=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
aws.s3.enable-data-loader=false

# S3 Data File Names (default naming convention)
aws.s3.file.users=user-json.gz
aws.s3.file.customers=customer-json.gz
aws.s3.file.franchises=franchise-json.gz
aws.s3.file.stores=store-json.gz
aws.s3.file.orders=order-json.gz
aws.s3.file.inventory-items=inventory-item-json.gz
aws.s3.file.notifications=notification-json.gz
aws.s3.file.activity-logs=activity-log-json.gz
